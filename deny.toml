# cargo-deny policy implementing the licence rules in spec/01
# ("Licence policy for dependencies"), cargo-deny 0.20.2 syntax.
# Starting template: research/raw/plan-crates-licence/codex.md §A10.

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# RUSTSEC-2023-0071 (rsa, Marvin attack): proton-srp's default rPGP
# backend pulls rsa 0.9 for Proton's RSA keys. The advisory is a timing
# sidechannel in RSA decryption/signing. Sweetbriar uses rsa through
# rPGP to verify Proton's modulus signature and, from M2.12, to unlock
# RSA address keys and decrypt mail. A sender chooses that ciphertext,
# but decryption runs locally where its timing isn't observable over
# the network. A named exception per spec/01's Crates table.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 via rPGP; Proton keys may be RSA (spec/01)" },
    # RUSTSEC-2026-0387 (crypto-bigint 0.5.5, timing variability):
    # proton-srp 0.8.4, the current crates.io release, pins crypto-bigint
    # 0.5.5; the fixed 0.7.6 is only taken by the unreleased proton-srp
    # 0.9.0. Sweetbriar uses it for SRP, where the client's secret
    # exponent is fresh randomness per attempt and the exchange is
    # authenticated by the server proof (spec/10). Revisit when a crates.io
    # proton-srp release carries the fix.
    { id = "RUSTSEC-2026-0387", reason = "proton-srp 0.8.4 pins crypto-bigint 0.5.5; no fixed crates.io release yet" },
    # RUSTSEC-2025-0144 (ml-dsa, timing side-channel in ML-DSA
    # decomposition): proton-rpgp 0.9.0 unconditionally enables pgp's
    # `pqc` feature, so ml-dsa 0.0.4 is compiled. Sweetbriar never
    # generates, imports or verifies ML-DSA keys: the pilot's address
    # keys are Proton's ECC (v4) keys and message/attachment decryption
    # uses their RSA/ECC session keys, so the vulnerable code path is
    # unreachable. The advisory needs precise local timing of ML-DSA
    # signing, which an attacker with that access already wins more
    # easily. No fixed version is reachable: pgp 0.21.1 pins ml-dsa to
    # ^0.0.4 and proton-rpgp 0.9.0 pins pgp 0.21; the fix
    # (>=0.1.0-rc.3) needs a pgp release. Revisit with the next
    # proton-rpgp.
    { id = "RUSTSEC-2025-0144", reason = "ml-dsa via pgp's pqc feature; no ML-DSA keys in the pilot and no fixed pgp release" },
    # RUSTSEC-2026-0543 (chrono unmaintained; no vulnerability named):
    # imap-types, under io-imap and imap-codec, depends on chrono
    # unconditionally for IMAP's date-time type. No Sweetbriar crate
    # uses chrono directly. The newest imap-types (2.0.0-alpha.8) still
    # requires it, so no update leaves it. Revisit when imap-types moves
    # off chrono or an advisory names a defect.
    { id = "RUSTSEC-2026-0543", reason = "chrono via imap-types' date-time; no release without it" },
]
maximum-db-staleness = "P1D"
unused-ignored-advisory = "warn"

[licenses]
confidence-threshold = 0.95
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
]
# MPL-2.0 is file-level copyleft, allowed by named exception per package
# and version (spec/01): UniFFI's crates, which entered the graph with
# sb-ffi and sb-bindgen in M0.8, and the CSS parsing family the M1.5
# renderer uses: lol_html's here, ammonia's with M1.5c1c.
exceptions = [
    { crate = "uniffi@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_core@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_macros@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_meta@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_pipeline@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_bindgen@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_internal_macros@0.32.2", allow = ["MPL-2.0"] },
    { crate = "uniffi_udl@0.32.2", allow = ["MPL-2.0"] },
    { crate = "cssparser@0.36.0", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.6.1", allow = ["MPL-2.0"] },
    { crate = "selectors@0.37.0", allow = ["MPL-2.0"] },
    { crate = "cssparser@0.38.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.7.1", allow = ["MPL-2.0"] },
    # webpki-root-certs is a wasm32-only dependency of
    # rustls-platform-verifier (and one of its dev-dependencies); it is
    # not linked into Sweetbriar's macOS or Linux builds.
    { crate = "webpki-root-certs@1.0.12", allow = ["CDLA-Permissive-2.0"] },
]

# proton-srp's crates.io metadata carries no SPDX license field, only a
# licence file; the file is MIT (spec/01's Crates table). The M2.12
# crates carry the same metadata gap and the same MIT licence file
# (research/proton-api/keys-crypto.md §6).
[[licenses.clarify]]
crate = "proton-srp"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x41b32367 }]

[[licenses.clarify]]
crate = "proton-crypto"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x41b32367 }]

[[licenses.clarify]]
crate = "proton-crypto-account"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x41b32367 }]

[[licenses.clarify]]
crate = "proton-rpgp"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x41b32367 }]

# libbz2-rs-sys's crates.io metadata says the non-standard
# `bzip2-1.0.6`; the file is a permissive BSD-style licence (the
# policy's BSD-3-Clause), so the metadata is clarified.
[[licenses.clarify]]
crate = "libbz2-rs-sys"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0x6022ceaf }]

# Sweetbriar's own crates are publish = false; their Unlicense OR 0BSD
# offering is already on the allow list above.
[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Immutable parser backports; exact revisions are pinned in Cargo.toml.
allow-git = [
    "https://github.com/BigBoyDevBox/askama",
    "https://github.com/BigBoyDevBox/mail-parser",
]
