# The macOS app (spec/08 "Platform"): `xcodegen generate --spec
# apps/macos/project.yml` produces `Sweetbriar.xcodeproj` (ignored).
# Layout: the generated `SweetbriarCore` Swift package (xtask ffi),
# the `SweetbriarBridge` L1 framework, the `Sweetbriar` AppKit app,
# and the two Swift-Testing bundles — the bridge's, and the
# app-hosted `SweetbriarTests` for the benchmark's Foundation-only
# logic (M0.10).

name: Sweetbriar

options:
  bundleIdPrefix: com.sweetbriar
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.0.1"
    # Linker warnings fail the build too, like the compilers' (spec/08
    # strictness): an object built for a newer macOS than the app's
    # minimum, say.
    OTHER_LDFLAGS: -Wl,-fatal_warnings

packages:
  SweetbriarCore:
    path: SweetbriarCore

targets:
  SweetbriarBridge:
    type: framework
    platform: macOS
    sources:
      - SweetbriarBridge
    dependencies:
      - package: SweetbriarCore
        product: SweetbriarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweetbriar.SweetbriarBridge
        # Signing needs an Info.plist; the framework's carries nothing
        # of its own, so Xcode generates it.
        GENERATE_INFOPLIST_FILE: YES

  Sweetbriar:
    type: application
    platform: macOS
    sources:
      - Sweetbriar
    dependencies:
      - target: SweetbriarBridge
        embed: true
    # The licence notices go inside the bundle, before Xcode signs it,
    # so the installed app and every zip of it carry them (spec/01
    # licence policy). The script reads the Rust toolchain's standard
    # library notices outside the project, so it runs unsandboxed.
    postBuildScripts:
      - name: Bundle licence notices
        shell: /bin/bash
        script: bash "$SRCROOT/../../scripts/bundle-notices.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/../../scripts/bundle-notices.sh
          - $(SRCROOT)/../../THIRD_PARTY_NOTICES.md
          - $(SRCROOT)/../../LICENSE
          - $(SRCROOT)/../../LICENSE-0BSD
          - $(SRCROOT)/../../rust-toolchain.toml
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/THIRD_PARTY_NOTICES.md
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE-0BSD
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Rust-Licenses.html
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Sweetbriar/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication

  SweetbriarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SweetbriarCore/Tests/SweetbriarCoreTests
    dependencies:
      - package: SweetbriarCore
        product: SweetbriarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweetbriar.SweetbriarCoreTests
        GENERATE_INFOPLIST_FILE: YES

  SweetbriarBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SweetbriarBridgeTests
    dependencies:
      - target: SweetbriarBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweetbriar.SweetbriarBridgeTests
        GENERATE_INFOPLIST_FILE: YES

  # The app-hosted bundle (plan M0.10): `@testable import Sweetbriar`
  # drives the benchmark's Foundation-only statistics, report and row
  # presentation inside the running app.
  SweetbriarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SweetbriarTests
    dependencies:
      - target: Sweetbriar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweetbriar.SweetbriarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sweetbriar.app/Contents/MacOS/Sweetbriar
        BUNDLE_LOADER: $(TEST_HOST)

  SweetbriarUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/SweetbriarUITests
      # The import flow's synthetic mailbox (spec/11).
      - path: Tests/Fixtures/ImportFlow.mbox
        buildPhase: resources
    dependencies:
      - target: Sweetbriar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweetbriar.SweetbriarUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sweetbriar
        # The runner inherits these: the reader canary needs loopback.
        CODE_SIGN_ENTITLEMENTS: Tests/SweetbriarUITests/SweetbriarUITests.entitlements

schemes:
  Sweetbriar:
    build:
      targets:
        Sweetbriar: all
        SweetbriarCoreTests: [test]
        SweetbriarBridgeTests:
          - test
        SweetbriarTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SweetbriarCoreTests
        - SweetbriarBridgeTests
        - SweetbriarTests

  # UI automation stays in the nightly/release lane (spec/11).
  SweetbriarSmoke:
    build:
      targets:
        Sweetbriar: all
        SweetbriarUITests: [test]
    test:
      config: Debug
      targets:
        - SweetbriarUITests
