[package]
name = "sb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-types = { version = "0.0.1", path = "../sb-types" }
# spec/01 crate table: `bundled` links SQLite 3.53.2 via libsqlite3-sys
# 0.38.2 (>= 3.51.3, never the withdrawn 3.52.0); `backup` and `limits`
# per spec/03 for later steps. Compile options come from
# LIBSQLITE3_FLAGS in .cargo/config.toml.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
# spec/01 crate table: SHA-256 object ids (spec/03), no default
# features — the core hashing needs no `std` extras.
sha2 = { version = "=0.11.1", default-features = false }
# Canonical import provenance and checkpoints (spec/02); same pin as xtask.
serde_json = "=1.0.154"

[features]
# Test-only writes for the layers above, as M1.3e's window tests need:
# never enabled outside dev-dependencies.
test-seams = []

[dev-dependencies]
sb-test-support = { version = "0.0.1", path = "../sb-test-support" }
# spec/01 crate table: model tests (spec/11), here the list projection's
# representative invariant. `std` only: no forking test runner.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
