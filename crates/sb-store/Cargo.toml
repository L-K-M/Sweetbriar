[package]
name = "sb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-types = { version = "0.0.0", path = "../sb-types" }
# spec/01 crate table: `bundled` links SQLite 3.53.2 via libsqlite3-sys
# 0.38.2 (>= 3.51.3, never the withdrawn 3.52.0); `backup` and `limits`
# per spec/03 for later steps. Compile options come from
# LIBSQLITE3_FLAGS in .cargo/config.toml.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }

[dev-dependencies]
sb-test-support = { version = "0.0.0", path = "../sb-test-support" }
