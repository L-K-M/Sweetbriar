[package]
name = "sb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-types = { version = "0.0.1", path = "../sb-types" }
# spec/01 crate table: `bundled` links SQLite 3.53.2 via libsqlite3-sys
# 0.38.2 (>= 3.51.3, never the withdrawn 3.52.0); `backup` and `limits`
# per spec/03 for later steps. Compile options come from
# LIBSQLITE3_FLAGS in .cargo/config.toml.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
# spec/01 crate table: SHA-256 object ids (spec/03), no default
# features — the core hashing needs no `std` extras.
sha2 = { version = "=0.11.1", default-features = false }
# Canonical storage JSON and strict borrowed query values (spec/02, 06).
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
# spec/01 crate table: validated explicit IANA date operands (spec/06
# "Zoned date operands", M1.6f0). Only the bundled database is used; no
# system timezone, host zoneinfo or global clock feature is enabled.
jiff = { version = "=0.2.37", default-features = false, features = [
    "std",
    "tzdb-bundle-always",
] }
# spec/01 crate table: UTS 46 domain-name validity for search address
# operands (spec/06 "Address operands", M1.6f0b). Already linked via
# `url`; the mapped output is a validity check only and never becomes a
# comparison key.
idna = "=1.1.0"

[features]
# Test-only writes for the layers above, as M1.3e's window tests need:
# never enabled outside dev-dependencies.
test-seams = []

[dev-dependencies]
sb-test-support = { version = "0.0.1", path = "../sb-test-support" }
# spec/01 crate table: model tests (spec/11), here the list projection's
# representative invariant. `std` only: no forking test runner.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
