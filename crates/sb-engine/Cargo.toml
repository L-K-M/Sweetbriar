[package]
name = "sb-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-resources = { version = "0.0.1", path = "../sb-resources" }
# spec/01 crate table: the one async runtime, owned by the engine
# (spec/01 "Process model"). Only the multi-thread scheduler: no I/O
# driver, no timers, no macros — the core's futures are runtime-neutral
# otherwise.
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
sb-test-support = { version = "0.0.1", path = "../sb-test-support" }
# The import crash-cut suite opens the engine on `CutFs` (spec/11).
sb-resources = { version = "0.0.1", path = "../sb-resources", features = ["test-seams"] }
# The M1.6q search timing report (spec/11); already pinned by sb-store.
serde_json = "=1.0.154"
