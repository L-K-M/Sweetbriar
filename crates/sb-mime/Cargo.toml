[package]
name = "sb-mime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-types = { version = "0.0.1", path = "../sb-types" }
# spec/01 crate table: MIME parsing, bounded per spec/10. `full_encoding`
# keeps single/multi-byte charset coverage; Sweetbriar enforces the
# resource budgets before delegating (see src/walk.rs).
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
# The charset decoder mail-parser's `full_encoding` already uses, asked
# directly whether decoding replaced anything (spec/07
# `charset_replaced`): a literal U+FFFD in the text is not a loss.
encoding_rs = "=0.8.42"
# spec/10 "Rendering" (M1.5): parsing inline CSS and URLs for the
# renderer's resource and link policy — never by regex. cssparser 0.38
# is ammonia's own.
cssparser = "=0.38.0"
url = "=2.5.8"
# spec/10 "Rendering": the streaming first pass that rewrites `cid:`
# URLs and inventories remote resources before sanitizing.
lol_html = "=3.0.2"
# spec/10 "Rendering": the final allow-list sanitizer. 4.2.4 carries
# the fix for RUSTSEC-2026-0373 (case-varied CSS `URL()`).
ammonia = "=4.2.4"
# The HTML5 named character references and C1 remapping ammonia's parser
# uses (spec/10 "Rendering"): the sanitizer decodes text references itself
# so html5ever 0.40's quadratic escaping never sees an `&` (render.rs).
markup5ever = "=0.40.0"
# spec/06 text-node extraction; already resolved through ammonia. No serialization.
html5ever = "=0.40.1"

[dev-dependencies]
# spec/01 crate table: snapshot testing of the fixtures/eml corpus.
insta = "=1.49.0"
# Pin the exact decoded fixture bytes independently of MIME summaries.
sha2 = { version = "=0.11.1", default-features = false }
