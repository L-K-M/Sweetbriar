[package]
name = "sb-mime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-types = { version = "0.0.1", path = "../sb-types" }
# spec/01 crate table: MIME parsing, bounded per spec/10. `full_encoding`
# keeps single/multi-byte charset coverage; Sweetbriar enforces the
# resource budgets before delegating (see src/walk.rs).
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
# spec/10 "Rendering" (M1.5): parsing inline CSS and URLs for the
# renderer's resource and link policy — never by regex.
cssparser = "=0.38.0"
url = "=2.5.8"
# spec/10 "Rendering": the streaming first pass that rewrites `cid:`
# URLs and inventories remote resources before sanitizing.
lol_html = "=3.0.1"

[dev-dependencies]
# spec/01 crate table: snapshot testing of the fixtures/eml corpus.
insta = "=1.49.0"
# Pin the exact decoded fixture bytes independently of MIME summaries.
sha2 = { version = "=0.11.1", default-features = false }
