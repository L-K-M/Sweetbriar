[package]
name = "sb-resources"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-store = { version = "0.0.1", path = "../sb-store" }
sb-mime = { version = "0.0.1", path = "../sb-mime" }
sb-imap = { version = "0.0.1", path = "../sb-imap" }
sb-smtp = { version = "0.0.1", path = "../sb-smtp" }
sb-platform = { version = "0.0.1", path = "../sb-platform" }
# Version-1 `import_job_sources.source_json` metadata (spec/09); same
# pin as sb-store, no serde derive.
serde_json = "=1.0.154"

[features]
# Crash-cut suites open the store on an injected filesystem seam
# (spec/11); only dev-dependencies enable it, never a production build.
test-seams = ["sb-store/test-seams"]

[dev-dependencies]
sb-test-support = { version = "0.0.1", path = "../sb-test-support" }
