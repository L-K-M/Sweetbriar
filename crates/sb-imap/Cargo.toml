[package]
name = "sb-imap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-types = { version = "0.0.1", path = "../sb-types" }
# M2.1's chosen IMAP client (spec/01's Crates table). `client` is the
# std-blocking pump the committed spike test drives; M2.2 drives the
# I/O-free coroutines directly over its own transport.
io-imap = { version = "=0.7.1", default-features = false, features = ["client"] }
# RFC 3501 section 5.1.3 modified UTF-7 (M2.2b0). Exact pin; already
# in the tree as io-imap's transitive dependency, so no version update.
base64 = { version = "=0.23.1" }
# `nom`'s alloc feature is what imap-codec alpha.9 forgets to ask
# for, so a direct pin supplies it by unification.
nom = { version = "=7.1.3", features = ["alloc"] }
# The workspace's TLS crate (spec/01); 0.23.46 carries the
# RUSTSEC-2026-0346..0349 fixes.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# The async transport (spec/01): no default features, just what the
# ring provider needs, matching the rustls features above.
tokio = { version = "=1.54.1", default-features = false, features = ["net", "io-util", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
# The pinned-certificate hash (spec/10).
sha2 = { version = "=0.11.1", default-features = false }
# Zeroizing in-memory credential box (spec/01 pin, spec/10); the LOGIN
# password's lifetime ends with its drop.
secrecy = "=0.10.3"
# io-imap logs raw replies at TRACE, which can include echoed credentials.
# Feature unification disables log TRACE diagnostics process-wide.
log = { version = "=0.4.34", features = ["max_level_debug"] }

[dev-dependencies]
sb-test-support = { version = "0.0.1", path = "../sb-test-support" }
# Current-thread async tests and deterministic operation-deadline clocks.
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "test-util"] }
