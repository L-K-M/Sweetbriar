[package]
name = "sb-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-platform = { version = "0.0.1", path = "../sb-platform" }
sb-types = { version = "0.0.1", path = "../sb-types" }
# `SIGKILL` for the crash-cut harness and `ENOSPC`/`EIO` for fault
# injection; the same pin `sb-platform` carries (spec/01).
libc = "=0.2.191"
# Reading and damaging a store's database from outside the store, for
# tests above it (the marker, injected corruption).
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
# The fake IMAP server frames client commands on the client's IMAP
# codec (spec/11): imap-codec 2.0.0-alpha.9, the codec io-imap 0.7.1
# builds on (spec/01).
imap-codec = "=2.0.0-alpha.9"
# imap-codec declares nom without features, but its parsers use
# alloc-gated combinators nothing else enables; this pin supplies
# the missing `alloc` feature by unification.
nom = { version = "=7.1.3", features = ["alloc"] }
# STARTTLS on the fake server: the workspace's TLS crate (spec/01),
# at 0.23.46 — 0.23.45 carries RUSTSEC-2026-0346..0349.
rustls = { version = "=0.23.46", default-features = false, features = [
    "ring",
    "std",
    "logging",
    "tls12",
] }
