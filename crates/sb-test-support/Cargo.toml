[package]
name = "sb-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sb-platform = { version = "0.0.1", path = "../sb-platform" }
sb-types = { version = "0.0.1", path = "../sb-types" }
# `SIGKILL` for the crash-cut harness and `ENOSPC`/`EIO` for fault
# injection; the same pin `sb-platform` carries (spec/01).
libc = "=0.2.190"
# Reading and damaging a store's database from outside the store, for
# tests above it (the marker, injected corruption).
rusqlite = { version = "=0.41.1", features = ["bundled", "backup", "limits"] }
# The fake IMAP server frames client commands on the client's IMAP
# codec (spec/11): imap-codec 2.0.0-alpha.9, the codec io-imap 0.7.1
# builds on (spec/01).
imap-codec = "=2.0.0-alpha.9"
# imap-codec declares nom without features, but its parsers use
# alloc-gated combinators nothing else enables; this pin supplies
# the missing `alloc` feature by unification.
nom = { version = "=8.0.0", features = ["alloc"] }
# STARTTLS on the fake server: the workspace's TLS crate (spec/01),
# at 0.23.46 — 0.23.45 carries RUSTSEC-2026-0346..0349.
rustls = { version = "=0.23.46", default-features = false, features = [
    "ring",
    "std",
    "logging",
    "tls12",
] }
# The fake Proton API server (spec/11): HTTPS on 127.0.0.1 with the
# committed test certificate, SRP sign-in through proton-srp's server
# side, and the auth routes sb-proton drives (M2.11). From M2.12 it
# also generates the synthetic user and address keys and the encrypted
# message/attachment fixtures, through Proton's key model
# (research/proton-api/keys-crypto.md).
proton-srp = "=0.8.4"
proton-crypto = { version = "=0.14.1", default-features = false, features = [
    "rustpgp",
] }
proton-crypto-account = { version = "=0.20.1", default-features = false, features = [
    "rustpgp",
] }
# Signing the fake server's test modulus with a test key.
pgp = "=0.21.1"
rand = "=0.8.6"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = [
    "server",
    "http1",
    "tokio",
    "service",
] }
http-body-util = "=0.1.5"
tokio = { version = "=1.54.1", default-features = false, features = [
    "net",
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
    "macros",
] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
bytes = "=1.12.1"
serde_json = "=1.0.154"
base64 = "=0.23.1"
