[workspace]
resolver = "3"
members = [
    "crates/sb-ffi",
    "crates/sb-cli",
    "crates/sb-service",
    "crates/sb-engine",
    "crates/sb-resources",
    "crates/sb-store",
    "crates/sb-mime",
    "crates/sb-imap",
    "crates/sb-smtp",
    "crates/sb-platform",
    "crates/sb-types",
    "crates/sb-test-support",
    "crates/sb-bindgen",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Unlicense OR 0BSD"
publish = false
rust-version = "1.99"

# Parser/FFI containment must remain effective in the shipped app (spec/10).
[profile.release]
panic = "unwind"

# mail-parser's debug_assertions and overflow checks fire on states its
# release build already recovers from — e.g. the fuzz-minimized input in
# fixtures/eml/fuzz-rfc822-partid.eml trips `debug_assert!("Invalid part
# ID")`, then release falls through to its corrupted-MIME recovery path.
# sb-mime's contract is the shipped behaviour, so compile this dep to
# release semantics in every profile; sb-mime's own asserts stay enabled.
# Reported upstream as stalwartlabs/mail-parser#164 — remove these
# overrides once a fixed release lands so assert-enabled test builds
# catch upstream invariant regressions again.
[profile.dev.package.mail-parser]
debug-assertions = false
overflow-checks = false

[profile.release.package.mail-parser]
debug-assertions = false
overflow-checks = false

# RUSTSEC-2026-0374: the published Askama config feature still uses
# unmaintained basic-toml. This reviewed v0.16.1 backport changes only
# that parser and its tests; UniFFI versions and template output stay put.
[patch.crates-io]
askama_derive = { git = "https://github.com/BigBoyDevBox/askama", rev = "da7f1d08c1690c576e3a7fd0a0f3436bc64e0440" }
# Release-based source-fidelity repair; no parser API/dependency upgrade.
mail-parser = { git = "https://github.com/BigBoyDevBox/mail-parser", rev = "41cbc85ce90b52ec33c7c7285f714fcdbcbc2928" }
