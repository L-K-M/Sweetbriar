name: macos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: macos-26
    timeout-minutes: 5
    # paths-filter lists a PR's changed files through the GitHub API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Log image
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the filter can diff on push events.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'xtask/**'
              - 'apps/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'layers.toml'
              - '.github/workflows/macos.yml'

  # Rust tests and check-layers (M0.1), the UniFFI bindings and the
  # XCFramework (M0.8); M0.9 adds the XcodeGen-generated project, an
  # `xcodebuild build test` of the app scheme, and the zipped .app
  # artifact (spec/11).
  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          xcodebuild -version
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      # check-layers (and its integration tests under `cargo test`)
      # sees the macOS-cfg surface here (spec/01); it needs rustdoc's
      # unstable JSON on a pinned nightly.
      - name: Install nightly for check-layers
        run: rustup toolchain install nightly-2026-10-10 --profile minimal
      - name: cargo test (aarch64-apple-darwin)
        run: cargo test --workspace --target aarch64-apple-darwin
      - name: check-layers
        run: cargo xtask check-layers
      # The committed bindings match the exports, resolve their FFI
      # import and type-check, and no async foreign callback is
      # exported (spec/07). Before `xtask ffi`, which overwrites the
      # committed bindings and would hide their drift.
      - name: check-ffi
        run: cargo xtask check-ffi
      # Builds the XCFramework for aarch64-apple-darwin (plan M0.8);
      # the Swift package and the app link it below.
      - name: xtask ffi
        run: cargo xtask ffi

      # XcodeGen writes the .xcodeproj (gitignored) the build and the
      # tests run from. Pinned and SHA-256-verified before unzipping.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate the Xcode project
        run: "$RUNNER_TEMP/xcodegen/bin/xcodegen generate --spec apps/macos/project.yml"

      - name: xcodebuild build test
        run: |
          xcodebuild -project apps/macos/Sweetbriar.xcodeproj \
            -scheme Sweetbriar \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Sweetbriar.xcresult" \
            CODE_SIGN_IDENTITY=- \
            build test

      - name: Upload the test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweetbriar-xcresult
          path: ${{ runner.temp }}/Sweetbriar.xcresult

      # A Release app for whoever pulls the artifact: same signing,
      # zipped the way Finder would make it.
      - name: Release build and zip the app
        run: |
          xcodebuild -project apps/macos/Sweetbriar.xcodeproj \
            -scheme Sweetbriar \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -configuration Release \
            CODE_SIGN_IDENTITY=- \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/Sweetbriar.app" \
            "$RUNNER_TEMP/Sweetbriar.zip"

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweetbriar-app
          path: ${{ runner.temp }}/Sweetbriar.zip

      # M0.10's decision run: the benchmark exercises the Release app
      # end to end — the 500k fill, all four ABBA runs and their
      # checks — which no earlier step does, and it is how the
      # AppKit-vs-SwiftUI evidence reaches the owner. Its numbers are
      # diagnostic (the owner's Mac decides) but a run whose checks
      # fail is a regression the gate must stop.
      # `-LogForEachSlowPath` (SwiftUI's documented diagnostic) logs a
      # `ForEach` that falls off its fast identity path.
      # Four runs of at most five minutes each (the harness's budget),
      # plus the fill and a blocked main thread's overrun.
      - name: Run the list benchmark
        timeout-minutes: 30
        run: |
          LOG="$RUNNER_TEMP/list-benchmark.log"
          open -W -n -a \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/Sweetbriar.app" \
            --stdout "$LOG" --stderr "$LOG" \
            --args -runListBenchmark "$RUNNER_TEMP/list-benchmark.json" \
            -LogForEachSlowPath YES

      - name: Print the benchmark log and report
        if: always()
        run: |
          echo "--- benchmark log ---"
          cat "$RUNNER_TEMP/list-benchmark.log" || true
          echo "--- benchmark report ---"
          cat "$RUNNER_TEMP/list-benchmark.json" || true

      # The gate: the report exists and AppKit's cold run (the
      # shipping list, in a clean process) passed every check. SwiftUI
      # failing its checks is the comparison's finding, not a
      # regression; AppKit's warm run follows SwiftUI's multi-gigabyte
      # runs in this 7 GB VM, so it is recorded, not gated.
      - name: Check the benchmark's verdict
        if: always()
        run: |
          jq -e '[.runs[] | select(.implementation == "appkit" and .pass == "cold") | .ok]
            | length == 1 and all' "$RUNNER_TEMP/list-benchmark.json"

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: list-benchmark
          path: ${{ runner.temp }}/list-benchmark.json
          if-no-files-found: warn

  # Aggregate merge gate: always runs so the check exists on every PR;
  # succeeds when the build job succeeded or was skipped by the filter.
  macos:
    if: always()
    needs: [changes, build]
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Log image
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(echo "$NEEDS" | jq '[.[] | .result] | all(. == "success" or . == "skipped")')" = "true" ]
