name: recvflake-soak

on:
  push:

permissions:
  contents: read

jobs:
  soak:
    if: startsWith(github.ref, 'refs/heads/validation/recvflake-soak-')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 360
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4ddd7cdb0391c446030366570455622fbd481dfc
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log tested revision and runner
        run: |
          test "$(git rev-parse HEAD)" = "4ddd7cdb0391c446030366570455622fbd481dfc"
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Build test-only fsync shim
        run: |
          cat > "$RUNNER_TEMP/no-fsync.c" <<'C'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <string.h>
          #include <unistd.h>

          static int is_test_binary(void) {
            static int state = -1;
            if (state >= 0) return state;
            char path[4096];
            ssize_t n = readlink("/proc/self/exe", path, sizeof path - 1);
            if (n <= 0) return state = 0;
            path[n] = 0;
            return state = strstr(path, "/debug/deps/") != 0 ||
                           strstr(path, "/release/deps/") != 0;
          }

          #define FORWARD(name, sig, ...)                         \
            static int (*real)sig;                                \
            if (is_test_binary()) return 0;                        \
            if (!real) *(void **)&real = dlsym(RTLD_NEXT, name);  \
            return real(__VA_ARGS__)

          int fsync(int fd) { FORWARD("fsync", (int), fd); }
          int fdatasync(int fd) { FORWARD("fdatasync", (int), fd); }
          int syncfs(int fd) { FORWARD("syncfs", (int), fd); }
          int sync_file_range(int fd, long long off, long long n, unsigned flags) {
            FORWARD("sync_file_range", (int, long long, long long, unsigned),
                    fd, off, n, flags);
          }
          C
          cc -shared -fPIC -O2 "$RUNNER_TEMP/no-fsync.c" \
            -ldl -o "$RUNNER_TEMP/no-fsync.so"

      - name: Build the sb-engine test binary
        id: binary
        run: |
          test_binary=$(cargo test -p sb-engine --lib --no-run --message-format=json \
            | python3 -c '
          import json, sys
          paths = []
          for line in sys.stdin:
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = event.get("target", {})
              if (event.get("reason") == "compiler-artifact"
                      and event.get("profile", {}).get("test")
                      and target.get("name") == "sb_engine"
                      and event.get("executable")):
                  paths.append(event["executable"])
          if len(paths) != 1:
              raise SystemExit(f"expected one sb-engine test binary, got {paths}")
          print(paths[0])
          ')
          test -x "$test_binary"
          echo "path=$test_binary" >> "$GITHUB_OUTPUT"

      - name: Run the requested command once
        env:
          LD_PRELOAD: ${{ runner.temp }}/no-fsync.so
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/recvflake-logs"
          cargo test -p sb-engine --lib received_tests 2>&1 \
            | tee "$RUNNER_TEMP/recvflake-logs/requested-command.log"
          grep -Fq \
            "test result: ok. 37 passed; 0 failed; 1 ignored;" \
            "$RUNNER_TEMP/recvflake-logs/requested-command.log"

      - name: Run loaded module passes
        timeout-minutes: 300
        env:
          LD_PRELOAD: ${{ runner.temp }}/no-fsync.so
          TEST_BINARY: ${{ steps.binary.outputs.path }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/recvflake-logs"
          mkdir -p "$logs"
          export logs

          "$TEST_BINARY" received_tests --list > "$logs/received-tests.list"
          test "$(grep -c '^received_tests::.*: test$' \
            "$logs/received-tests.list")" -eq 38

          setsid bash -c '
            set -u
            run=0
            while test ! -e "$logs/parallel-load.stop"; do
              run=$((run + 1))
              if ! "$TEST_BINARY" --exact \
                received_tests::native_write_and_commit_failures_roll_back_then_retry_at_bounded_deadlines \
                >> "$logs/parallel-load.log" 2>&1; then
                echo "$run" > "$logs/parallel-load.failed"
                exit 1
              fi
              printf "%s\n" "$run" > "$logs/parallel-load.count.tmp"
              mv "$logs/parallel-load.count.tmp" \
                "$logs/parallel-load.count"
            done
          ' &
          load_pid=$!

          setsid nice -n 15 yes > /dev/null &
          burner_one=$!
          setsid nice -n 15 yes > /dev/null &
          burner_two=$!

          cleanup() {
            trap - EXIT TERM INT
            for group in "$load_pid" "$burner_one" "$burner_two"; do
              kill -TERM -- "-$group" 2>/dev/null || true
            done
            wait "$load_pid" "$burner_one" "$burner_two" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT

          first_pass=$((SHARD * 25 + 1))
          last_pass=$((first_pass + 24))
          for run in $(seq -f "%03g" "$first_pass" "$last_pass"); do
            echo "received_tests pass $run/100"
            kill -0 "$load_pid"
            kill -0 "$burner_one"
            kill -0 "$burner_two"
            test ! -e "$logs/parallel-load.failed"
            if ! "$TEST_BINARY" received_tests > "$logs/pass-$run.log" 2>&1; then
              tail -200 "$logs/pass-$run.log"
              exit 1
            fi
            grep -Fq \
              "test result: ok. 37 passed; 0 failed; 1 ignored;" \
              "$logs/pass-$run.log"
          done

          kill -0 "$load_pid"
          kill -0 "$burner_one"
          kill -0 "$burner_two"
          test ! -e "$logs/parallel-load.failed"
          touch "$logs/parallel-load.stop"
          wait "$load_pid"
          kill -0 "$burner_one"
          kill -0 "$burner_two"
          test ! -e "$logs/parallel-load.failed"
          cleanup

          load_count=$(cat "$logs/parallel-load.count")
          test "$load_count" -ge 1
          test "$(grep -Fc \
            "test result: ok. 1 passed; 0 failed; 0 ignored;" \
            "$logs/parallel-load.log")" -eq "$load_count"
          printf 'tested_ref=%s\nfirst_pass=%s\nlast_pass=%s\npasses=25\nparallel_load_passes=%s\n' \
            "4ddd7cdb0391c446030366570455622fbd481dfc" \
            "$first_pass" "$last_pass" "$load_count" \
            > "$logs/summary.txt"

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recvflake-soak-4ddd7cd-${{ matrix.shard }}
          path: ${{ runner.temp }}/recvflake-logs
          if-no-files-found: error

  aggregate:
    if: always() && startsWith(github.ref, 'refs/heads/validation/recvflake-soak-')
    needs: soak
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard to succeed
        env:
          SOAK_RESULT: ${{ needs.soak.result }}
        run: test "$SOAK_RESULT" = success

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recvflake-soak-4ddd7cd-[0-3]
          path: ${{ runner.temp }}/soak-artifacts

      - name: Verify all 100 passes
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/soak-artifacts"
          expected_module_result='test result: ok. 37 passed; 0 failed; 1 ignored;'
          expected_load_result='test result: ok. 1 passed; 0 failed; 0 ignored;'

          require_results() {
            local file=$1
            local expected=$2
            local wanted=$3
            test -f "$file"
            awk -v expected="$expected" -v wanted="$wanted" '
              /^test result:/ {
                count++
                if (index($0, expected) != 1) exit 1
              }
              END { if (count != wanted) exit 1 }
            ' "$file"
          }

          require_module_result() {
            local file=$1
            test -f "$file"
            # Child tests report first; the module result must be last.
            awk -v expected="$expected_module_result" '
              /^test result:/ {
                last = $0
                if (index($0, expected) == 1) matches++
              }
              END { if (matches != 1 || index(last, expected) != 1) exit 1 }
            ' "$file"
          }

          test "$(find "$artifacts" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 4
          for shard in 0 1 2 3; do
            logs="$artifacts/recvflake-soak-4ddd7cd-$shard"
            first_pass=$((shard * 25 + 1))
            last_pass=$((first_pass + 24))
            summary="$logs/summary.txt"
            test "$(wc -l < "$summary")" -eq 5
            grep -Fxq 'tested_ref=4ddd7cdb0391c446030366570455622fbd481dfc' "$summary"
            grep -Fxq "first_pass=$first_pass" "$summary"
            grep -Fxq "last_pass=$last_pass" "$summary"
            grep -Fxq 'passes=25' "$summary"

            inventory="$logs/received-tests.list"
            test "$(grep -c '^received_tests::.*: test$' "$inventory")" -eq 38
            test "$(grep '^received_tests::.*: test$' "$inventory" | sort -u | wc -l)" -eq 38
            require_module_result "$logs/requested-command.log"

            test ! -e "$logs/parallel-load.failed"
            test "$(wc -l < "$logs/parallel-load.count")" -eq 1
            load_count=$(cat "$logs/parallel-load.count")
            [[ "$load_count" =~ ^[1-9][0-9]*$ ]]
            grep -Fxq "parallel_load_passes=$load_count" "$summary"
            require_results "$logs/parallel-load.log" "$expected_load_result" "$load_count"

            test "$(find "$logs" -maxdepth 1 -name 'pass-*.log' | wc -l)" -eq 25
            for run in $(seq -f "%03g" "$first_pass" "$last_pass"); do
              require_module_result "$logs/pass-$run.log"
            done
          done
          printf 'tested_ref=4ddd7cdb0391c446030366570455622fbd481dfc\npasses=100\n' \
            > "$RUNNER_TEMP/aggregate.txt"
          cat "$RUNNER_TEMP/aggregate.txt"

      - name: Upload aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recvflake-soak-4ddd7cd-aggregate
          path: ${{ runner.temp }}/aggregate.txt
          if-no-files-found: error
