name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A reusable run must not compete with its release caller's group.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmt, clippy, tests and docs in one leg — the same order `cargo xtask
  # ci` runs them locally. The Dovecot protocol suite (spec/11) joins
  # this workflow in M2.
  rust:
    runs-on: ubuntu-24.04
    # The test step alone takes 8 to 14 minutes on a hosted runner.
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # The pinned toolchain (rust-toolchain.toml) is installed by the
      # rustup shim on first use; this step makes that explicit and logs
      # what CI actually ran on.
      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # check-layers (and its integration tests under `cargo test`)
      # reads rustdoc's unstable JSON output on a pinned nightly
      # (spec/01); the pin moves only deliberately.
      - name: Install nightly for check-layers
        run: rustup toolchain install nightly-2026-10-10 --profile minimal
      - name: test
        run: cargo test --workspace
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: check-layers
        run: cargo xtask check-layers

  # Plan M1.3: list window timings over 100k synthetic rows, recorded in
  # this job's log on every push to main and never asserted (the target
  # is under 5 ms). Not part of the merge gate below.
  window-timings:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Record window timings
        run: >
          cargo test -p sb-engine --release --lib list_window_timings
          -- --ignored --nocapture

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: cargo deny check
        run: cargo deny check

  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Check notices drift
        run: |
          cargo about generate notices.hbs --output-file "$RUNNER_TEMP/notices.md"
          if ! diff -u THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/notices.md"; then
            echo "::error::THIRD_PARTY_NOTICES.md is stale; regenerate with \`cargo xtask notices\` and commit the result"
            exit 1
          fi

  # The local build script: shellcheck, and `--install` against a fake
  # macOS toolchain (the macOS job reruns it under the system bash 3.2).
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log image
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          shellcheck --version
      - name: shellcheck
        run: shellcheck scripts/build.sh scripts/test-build-install.sh
      - name: build.sh --install
        run: bash scripts/test-build-install.sh

  # Aggregate merge gate: always runs so the check exists even when a
  # needed job fails; succeeds only when every other job succeeded.
  ci:
    if: always()
    needs: [rust, deny, notices, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log image
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(echo "$NEEDS" | jq '[.[] | .result] | all(. == "success")')" = "true" ]
