name: nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  # Exercise changes to this lane before they reach the daily run.
  pull_request:
    paths:
      - '.github/actions/package-macos/**'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/release.yml'
      - 'apps/macos/project.yml'
      - 'ci/go-proton-api/**'
      - 'crates/sb-service/src/accounts/proton_tests/lane.rs'
      - 'apps/macos/Tests/SweetbriarUITests/**'
      - 'crates/sb-mime/**'
      - 'crates/sb-store/Cargo.toml'
      - 'crates/sb-store/src/query.rs'
      - 'crates/sb-store/src/query/**'
      - 'fixtures/eml/**'
      - 'fixtures/import/**'
      - 'fixtures/search/**'
      - 'fuzz/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # M0.12 reserved this suite; a later step must supply real tests
  # before enabling it. A skipped suite is not passing evidence.
  fault-injection:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo '::error::Full nightly crash/power-loss suite is not implemented'
          exit 1

  # spec/11 "Model": the state-machine models with more cases than a
  # pull request runs. M3 and M4 add their models here.
  proptest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SB_PROPTEST_SCALE: '20'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Proton sync model
        run: cargo test --locked -p sb-store --lib proton::model_tests
      - name: Upload the failing cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proptest-regressions
          path: crates/sb-store/proptest-regressions
          if-no-files-found: ignore

  # M2.17: the read-only sync suite against Proton's own development
  # server. The driver seeds one synthetic account; the lane test is
  # gated on its JSON line.
  go-proton-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ci/go-proton-api/go.mod
      - name: Log toolchains and image
        run: |
          go version
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      # First, so a failed build still names its artifact.
      - name: Date the artifact
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Build the driver
        working-directory: ci/go-proton-api
        run: bash build.sh -o "$RUNNER_TEMP/gpa-driver"
      - name: Start the driver and run the lane
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpa"
          mkfifo "$RUNNER_TEMP/gpa/stdin"
          "$RUNNER_TEMP/gpa-driver" -request-log "$RUNNER_TEMP/gpa/requests.log" \
            < "$RUNNER_TEMP/gpa/stdin" > "$RUNNER_TEMP/gpa/line.json" \
            2> "$RUNNER_TEMP/gpa/driver.log" &
          driver=$!
          # Read-write so opening the FIFO never blocks; the driver's
          # stdin stays open until the trap kills it.
          exec 3<>"$RUNNER_TEMP/gpa/stdin"
          trap 'kill "$driver" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            [ -s "$RUNNER_TEMP/gpa/line.json" ] && break
            sleep 1
          done
          test -s "$RUNNER_TEMP/gpa/line.json" || {
            echo "the driver printed no line; its log:"
            cat "$RUNNER_TEMP/gpa/driver.log"
            exit 1
          }
          SB_GPA_LANE="$RUNNER_TEMP/gpa/line.json" \
          SB_GPA_LANE_SUMMARY="$RUNNER_TEMP/gpa/summary.json" \
            cargo test -p sb-service --lib lane -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/gpa/test.log"
      - name: Upload the lane artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-proton-api-${{ steps.date.outputs.date }}
          path: |
            ${{ runner.temp }}/gpa/line.json
            ${{ runner.temp }}/gpa/summary.json
            ${{ runner.temp }}/gpa/requests.log
            ${{ runner.temp }}/gpa/test.log
            ${{ runner.temp }}/gpa/driver.log
          if-no-files-found: warn

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mime
            seeds: ../fixtures/eml
          - target: mbox
            seeds: ../fixtures/import
          - target: query
            seeds: ../fixtures/search
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_SEEDS: ${{ matrix.seeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Log the fuzz toolchain and image
        working-directory: fuzz
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.20.2
      - name: Check the fuzz dependency graph
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check
      - name: Format the isolated fuzz target
        working-directory: fuzz
        run: cargo fmt --check
      # Persist the generated corpus between runs: without it every
      # 60-second run starts from the static seeds only and re-covers
      # the same shallow paths. Each run saves under its own key and
      # restores the most recent corpus via the prefix.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ matrix.target }}-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.target }}-fuzz-corpus-
      - name: Fuzz ${{ matrix.target }} for 60 seconds
        working-directory: fuzz
        run: |
          mkdir -p "corpus/$FUZZ_TARGET"
          # -O: fuzz the shipped build — cargo-fuzz otherwise injects
          # debug_assertions/overflow-checks into dependencies, where
          # upstream asserts (mail-parser "Invalid part ID") fire on
          # states the release parser recovers from.
          # --target: cargo-fuzz defaults to its own build triple, and
          # install-action ships a musl binary — ASAN needs gnu.
          cargo fuzz run -O --target x86_64-unknown-linux-gnu --fuzz-dir . \
            "$FUZZ_TARGET" "corpus/$FUZZ_TARGET" "$FUZZ_SEEDS" -- \
            -max_total_time=60 -max_len=1000000 -rss_limit_mb=2048 -timeout=10
          git diff --exit-code -- Cargo.lock
      - name: Upload findings on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-fuzz-findings
          path: fuzz/artifacts/${{ matrix.target }}
          # The failure can be deny/fmt too, where no artifacts exist.
          if-no-files-found: ignore

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.0'
    runs-on: ${{ matrix.runner }}
    # The preview image reports compatibility findings without gating
    # the stable runner's nightly artifact (spec/11).
    continue-on-error: ${{ matrix.runner == 'xcode-27' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/package-macos
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-xcresult-${{ matrix.runner }}
          path: ${{ runner.temp }}/Sweetbriar-*.xcresult
      - name: Upload the nightly DMG
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweetbriar-nightly-dmg
          path: ${{ runner.temp }}/Sweetbriar-*.dmg
          if-no-files-found: error
