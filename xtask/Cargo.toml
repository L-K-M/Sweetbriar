[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# `serde`, `serde_json` and `toml` are pinned for the check-layers
# command (spec/01): serde+serde_json parse `cargo metadata`, cargo's
# compiler messages and rustdoc's JSON output — the check reads
# toolchain output, never Rust source — and serde+toml read
# layers.toml.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
# The check-ffi lint reads UniFFI's own metadata (the same
# symbol-table bytes `sb-bindgen` generates from) to detect async
# callback interfaces and foreign traits; pinned to the workspace's
# uniffi version (spec/01), with `uniffi_meta` supplying the parsed
# metadata types.
uniffi_bindgen = { version = "=0.32.2", default-features = false }
uniffi_meta = "=0.32.2"
